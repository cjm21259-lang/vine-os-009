<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2D Zombie Survival with Accounts & Levels</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0; padding: 0; background: #111; color: #fff;
      font-family: Arial, sans-serif; display: flex; flex-direction: column;
      align-items: center; justify-content: center; min-height: 100vh; overflow: hidden;
    }
    #game-container {
      position: relative; width: 800px; max-width: 100vw; height: 500px;
      background: #222; border: 3px solid #444; border-radius: 8px; overflow: hidden;
    }
    canvas { display: block; width: 100%; height: 100%; }
    
    /* Login Screen Overlay */
    #login-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #0d0f12; display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 20;
    }
    #login-overlay h1 { color: #e74c3c; margin-bottom: 10px; font-size: 32px; }
    #login-overlay p { color: #aaa; margin-bottom: 30px; }
    .auth-btn {
      width: 250px; padding: 12px; margin: 8px 0; border: none; border-radius: 6px;
      font-weight: bold; font-size: 15px; cursor: pointer; display: flex;
      align-items: center; justify-content: center; gap: 10px;
    }
    .btn-google { background: #ffffff; color: #333; }
    .btn-apple { background: #000000; color: #fff; border: 1px solid #444; }
    .btn-guest { background: #34495e; color: #fff; }

    /* Intermission Shop Overlay */
    #shop-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 15, 15, 0.95); display: none; flex-direction: column;
      align-items: center; padding: 20px; box-sizing: border-box; z-index: 10;
    }
    #shop-overlay h2 { color: #4caf50; margin: 0 0 5px 0; font-size: 28px; }
    .shop-info { font-size: 16px; margin-bottom: 15px; color: #ffeb3b; }
    .shop-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      width: 100%; max-width: 650px; margin-bottom: 15px;
    }
    .shop-item {
      background: #2a2a2a; border: 1px solid #555; border-radius: 6px;
      padding: 10px; text-align: center; display: flex; flex-direction: column;
      justify-content: space-between; align-items: center;
    }
    .shop-item h4 { margin: 0 0 5px 0; font-size: 14px; color: #fff; }
    .shop-item p { margin: 0 0 8px 0; font-size: 12px; color: #aaa; }
    .shop-btn {
      background: #4caf50; border: none; color: #fff; padding: 6px 12px;
      font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 12px;
    }
    .shop-btn:hover { background: #45a049; }
    .shop-btn:disabled { background: #555; cursor: not-allowed; }
    #next-wave-btn {
      background: #2196f3; border: none; color: #fff; padding: 12px 30px;
      font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer;
    }
  </style>
</head>
<body>

<div id="game-container">
  <!-- Login Screen -->
  <div id="login-overlay">
    <h1>ZOMBIE SURVIVAL</h1>
    <p>Sign in to save your level and progress</p>
    <button class="auth-btn btn-google" onclick="login('Google')">Sign in with Google</button>
    <button class="auth-btn btn-apple" onclick="login('Apple')">Sign in with Apple</button>
    <button class="auth-btn btn-guest" onclick="login('Guest')">Play as Guest</button>
  </div>

  <canvas id="gameCanvas" width="800" height="500"></canvas>

  <!-- Intermission / Shop Overlay -->
  <div id="shop-overlay">
    <h2>WAVE COMPLETED!</h2>
    <div class="shop-info">Cash Available: $<span id="shop-money">0</span></div>
    
    <div class="shop-grid">
      <div class="shop-item">
        <h4>Refill Ammo (+30)</h4>
        <p>Cost: $50</p>
        <button class="shop-btn" onclick="buyAmmo()">Buy</button>
      </div>
      <div class="shop-item">
        <h4>Heal (+25 HP)</h4>
        <p>Cost: $75</p>
        <button class="shop-btn" onclick="buyHealth()">Buy</button>
      </div>
      <div class="shop-item">
        <h4>Speed Upgrade</h4>
        <p>Cost: $150</p>
        <button class="shop-btn" id="btn-speed" onclick="buySpeed()">Buy</button>
      </div>
      <div class="shop-item">
        <h4>Shotgun Gun</h4>
        <p>Cost: $300</p>
        <button class="shop-btn" id="btn-shotgun" onclick="buyShotgun()">Buy</button>
      </div>
      <div class="shop-item">
        <h4>Red Outfit</h4>
        <p>Cost: $100</p>
        <button class="shop-btn" id="btn-clothes" onclick="buyClothes('#e74c3c')">Equip</button>
      </div>
      <div class="shop-item">
        <h4>Dog Pet Companion</h4>
        <p>Cost: $400</p>
        <button class="shop-btn" id="btn-pet" onclick="buyPet()">Buy</button>
      </div>
    </div>

    <button id="next-wave-btn" onclick="startNextWave()">START NEXT WAVE</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// User Account & Level Data
let username = "Guest";
let level = 1;
let xp = 0;
let xpToNextLevel = 100;

// Game state
let money = 250;
let score = 0;
let wave = 1;
let waveState = 'LOGIN'; // 'LOGIN', 'PLAYING', 'INTERMISSION', 'GAMEOVER'
let zombiesToSpawn = 10;
let zombiesLeft = 10;

// Player
const player = {
  x: 400, y: 250, radius: 16, speed: 2.5,
  hp: 100, maxHp: 100,
  ammo: 60, maxAmmo: 90,
  weapon: 'rifle',
  color: '#3498db',
  hasPet: false
};

// Pet
const pet = { x: 380, y: 270, radius: 8, color: '#e67e22' };

// Input tracking
const keys = {};
const mouse = { x: 400, y: 250 };

window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', () => shoot());

// Authentication system
function login(provider) {
  username = provider === 'Guest' ? 'Guest Player' : `${provider} User`;
  document.getElementById('login-overlay').style.display = 'none';
  waveState = 'PLAYING';
}

// Leveling System logic
function addXP(amount) {
  xp += amount;
  if (xp >= xpToNextLevel) {
    xp -= xpToNextLevel;
    level++;
    xpToNextLevel = Math.floor(xpToNextLevel * 1.5);
    player.maxHp += 10;
    player.hp = player.maxHp; // Heal on level up
  }
}

// Entities
let bullets = [];
let zombies = [];

function spawnZombie() {
  let x, y;
  if (Math.random() < 0.5) {
    x = Math.random() < 0.5 ? -20 : canvas.width + 20;
    y = Math.random() * canvas.height;
  } else {
    x = Math.random() * canvas.width;
    y = Math.random() < 0.5 ? -20 : canvas.height + 20;
  }
  zombies.push({
    x: x, y: y, radius: 15,
    speed: 1 + Math.random() * 0.8,
    hp: 3, maxHp: 3
  });
}

let spawnTimer = 0;

function shoot() {
  if (waveState !== 'PLAYING' || player.ammo <= 0) return;

  const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

  if (player.weapon === 'rifle') {
    bullets.push({
      x: player.x, y: player.y,
      vx: Math.cos(angle) * 8, vy: Math.sin(angle) * 8,
      damage: 1
    });
    player.ammo -= 1;
  } else if (player.weapon === 'shotgun') {
    for (let i = -2; i <= 2; i++) {
      const spreadAngle = angle + (i * 0.1);
      bullets.push({
        x: player.x, y: player.y,
        vx: Math.cos(spreadAngle) * 7, vy: Math.sin(spreadAngle) * 7,
        damage: 1
      });
    }
    player.ammo -= 1;
  }
}

// Shop logic
function openShop() {
  waveState = 'INTERMISSION';
  document.getElementById('shop-money').innerText = money;
  document.getElementById('shop-overlay').style.display = 'flex';
}

function startNextWave() {
  wave += 1;
  zombiesToSpawn = 8 + wave * 4;
  zombiesLeft = zombiesToSpawn;
  waveState = 'PLAYING';
  document.getElementById('shop-overlay').style.display = 'none';
}

function buyAmmo() {
  if (money >= 50) { money -= 50; player.ammo += 30; document.getElementById('shop-money').innerText = money; }
}

function buyHealth() {
  if (money >= 75 && player.hp < player.maxHp) { money -= 75; player.hp = Math.min(player.maxHp, player.hp + 25); document.getElementById('shop-money').innerText = money; }
}

function buySpeed() {
  if (money >= 150) { money -= 150; player.speed += 0.5; document.getElementById('shop-money').innerText = money; document.getElementById('btn-speed').disabled = true; }
}

function buyShotgun() {
  if (money >= 300) { money -= 300; player.weapon = 'shotgun'; document.getElementById('shop-money').innerText = money; document.getElementById('btn-shotgun').innerText = 'Equipped'; document.getElementById('btn-shotgun').disabled = true; }
}

function buyClothes(color) {
  if (money >= 100) { money -= 100; player.color = color; document.getElementById('shop-money').innerText = money; document.getElementById('btn-clothes').innerText = 'Equipped'; document.getElementById('btn-clothes').disabled = true; }
}

function buyPet() {
  if (money >= 400) { money -= 400; player.hasPet = true; document.getElementById('shop-money').innerText = money; document.getElementById('btn-pet').innerText = 'Owned'; document.getElementById('btn-pet').disabled = true; }
}

// Update Loop
function update() {
  if (waveState !== 'PLAYING') return;

  // Movement
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;

  if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

  player.x += dx * player.speed;
  player.y += dy * player.speed;

  player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
  player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

  // Pet movement
  if (player.hasPet) {
    const pdx = player.x - pet.x;
    const pdy = player.y - pet.y;
    const dist = Math.hypot(pdx, pdy);
    if (dist > 35) {
      pet.x += (pdx / dist) * (player.speed * 0.9);
      pet.y += (pdy / dist) * (player.speed * 0.9);
    }
  }

  // Spawning zombies
  spawnTimer++;
  if (spawnTimer > 60 && zombiesToSpawn > 0) {
    spawnZombie();
    zombiesToSpawn--;
    spawnTimer = 0;
  }

  // Bullets update
  for (let i = bullets.length - 1; i >= 0; i--) {
    let b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) bullets.splice(i, 1);
  }

  // Zombies update
  for (let i = zombies.length - 1; i >= 0; i--) {
    let z = zombies[i];
    const angle = Math.atan2(player.y - z.y, player.x - z.x);
    z.x += Math.cos(angle) * z.speed;
    z.y += Math.sin(angle) * z.speed;

    // Player collision
    const distPlayer = Math.hypot(player.x - z.x, player.y - z.y);
    if (distPlayer < player.radius + z.radius) {
      player.hp -= 0.3;
      if (player.hp <= 0) waveState = 'GAMEOVER';
    }

    // Bullet collision
    for (let j = bullets.length - 1; j >= 0; j--) {
      let b = bullets[j];
      const distBullet = Math.hypot(b.x - z.x, b.y - z.y);
      if (distBullet < z.radius + 3) {
        z.hp -= b.damage;
        bullets.splice(j, 1);

        if (z.hp <= 0) {
          zombies.splice(i, 1);
          zombiesLeft--;
          money += 25;
          score += 50;
          addXP(35); // Earn XP per kill
          break;
        }
      }
    }
  }

  if (zombiesToSpawn <= 0 && zombies.length === 0) openShop();
}

// Render Loop
function draw() {
  ctx.fillStyle = '#1e1e1e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Background Grid
  ctx.strokeStyle = '#2a2a2a';
  ctx.lineWidth = 1;
  for (let x = 0; x < canvas.width; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  if (waveState === 'LOGIN') return;

  // Draw Pet
  if (player.hasPet) {
    ctx.fillStyle = pet.color;
    ctx.beginPath(); ctx.arc(pet.x, pet.y, pet.radius, 0, Math.PI * 2); ctx.fill();
  }

  // Draw Player
  ctx.fillStyle = player.color;
  ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fill();

  // Gun direction
  const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(player.x, player.y);
  ctx.lineTo(player.x + Math.cos(angle) * 24, player.y + Math.sin(angle) * 24); ctx.stroke();

  // Draw Zombies
  for (let z of zombies) {
    ctx.fillStyle = '#2ecc71';
    ctx.beginPath(); ctx.arc(z.x, z.y, z.radius, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#e74c3c'; ctx.fillRect(z.x - 10, z.y - 20, 20, 3);
    ctx.fillStyle = '#2ecc71'; ctx.fillRect(z.x - 10, z.y - 20, (z.hp / z.maxHp) * 20, 3);
  }

  // Draw Bullets
  ctx.fillStyle = '#f1c40f';
  for (let b of bullets) {
    ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI * 2); ctx.fill();
  }

  // Draw HUD Interface
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(10, 10, 240, 140);

  ctx.fillStyle = '#fff';
  ctx.font = '13px Arial';
  ctx.fillText(`PLAYER: ${username}`, 20, 30);
  ctx.fillText(`LVL ${level}  (XP: ${xp}/${xpToNextLevel})`, 20, 50);
  ctx.fillText(`WAVE: ${wave}`, 20, 70);
  ctx.fillText(`ZOMBIES LEFT: ${zombiesLeft}`, 20, 90);
  ctx.fillText(`AMMO: ${player.ammo}`, 20, 110);
  ctx.fillText(`CASH: $${money}`, 20, 130);

  // Player HP Bar
  ctx.fillStyle = '#555';
  ctx.fillRect(10, 160, 150, 10);
  ctx.fillStyle = '#e74c3c';
  ctx.fillRect(10, 160, Math.max(0, (player.hp / player.maxHp) * 150), 10);

  // Player XP Bar
  ctx.fillStyle = '#555';
  ctx.fillRect(10, 175, 150, 6);
  ctx.fillStyle = '#3498db';
  ctx.fillRect(10, 175, Math.max(0, (xp / xpToNextLevel) * 150), 6);

  if (waveState === 'GAMEOVER') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#e74c3c';
    ctx.font = '36px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('YOU DIED', canvas.width / 2, canvas.height / 2);
    ctx.font = '18px Arial'; ctx.fillStyle = '#fff';
    ctx.fillText('Refresh page to restart', canvas.width / 2, canvas.height / 2 + 40);
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
